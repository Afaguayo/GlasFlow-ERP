<!doctype html>
<html lang="es-MX" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlasFlow ERP</title>
  <meta name="description" content="GlasFlow ERP: inventario, ventas, producción y reportes para manufactura y distribución de vidrio.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      var t = null;
      try { t = localStorage.getItem('glasflow.theme'); } catch (e) { /* storage blocked */ }
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">GlasFlow ERP requiere JavaScript habilitado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
